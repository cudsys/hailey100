<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#17171f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* hailey.tools / 2gg Studio palette. Layout: one shell; Play = players strip, table + log, then your hand along the bottom. */
:root {
  --bg: #17171f; --panel: #1f1f29; --card: #272733; --card-2: #2f2f3d; --line: #34343f;
  --ink: #eeeef8; --muted: #9a9aae; --accent: #00f0f0; --accent-2: #32c2ca; --accent-ink: #0d1a1c;
  --accent-soft: rgba(0, 240, 240, .14); --red: #ff5b75; --ok: #3fb950;
  --t-point: #3fb950; --t-neg: #ff5b75; --t-act: #32c2ca; --t-ability: #b388ff; --t-mutator: #ffb84d; --t-character: #ff6fb5;
  --face: #20202a; --shadow: 0 10px 40px rgba(0, 0, 0, .45); --overlay: rgba(10, 10, 16, .72);
  --f-body: "Ubuntu", system-ui, sans-serif; --f-mono: "Ubuntu Mono", ui-monospace, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eceef3; --panel: #f6f7fa; --card: #ffffff; --card-2: #f0f1f6; --line: #dcdde6;
  --ink: #1d1d27; --muted: #6b6b7e; --accent: #00a9b3; --accent-2: #00a9b3; --accent-ink: #ffffff;
  --accent-soft: rgba(0, 169, 179, .14); --red: #e0405c; --ok: #2c9a40;
  --t-point: #2c9a40; --t-neg: #e0405c; --t-act: #0096a0; --t-ability: #7d55d9; --t-mutator: #d38a12; --t-character: #d6448d;
  --face: #ffffff; --shadow: 0 10px 34px rgba(30, 30, 60, .12); --overlay: rgba(40, 40, 60, .45);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceef3; --panel: #f6f7fa; --card: #ffffff; --card-2: #f0f1f6; --line: #dcdde6;
    --ink: #1d1d27; --muted: #6b6b7e; --accent: #00a9b3; --accent-2: #00a9b3; --accent-ink: #ffffff;
    --accent-soft: rgba(0, 169, 179, .14); --red: #e0405c; --ok: #2c9a40;
    --t-point: #2c9a40; --t-neg: #e0405c; --t-act: #0096a0; --t-ability: #7d55d9; --t-mutator: #d38a12; --t-character: #d6448d;
    --face: #ffffff; --shadow: 0 10px 34px rgba(30, 30, 60, .12); --overlay: rgba(40, 40, 60, .45);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--f-body); min-height: 100vh; text-transform: lowercase; }
button { text-transform: inherit; }
::placeholder { text-transform: lowercase; }
input, textarea, pre.json, .calc { text-transform: none; }
select, option { text-transform: lowercase; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: pop .35s cubic-bezier(.2,.9,.3,1.15) both; }
.top { display: flex; align-items: center; gap: 12px 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 2px; }
.top h1 .hun { font-family: var(--f-mono); color: var(--accent); font-weight: 700; margin-left: 6px; }
.top .sub { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.iconbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; font-size: 15px; display: grid; place-items: center; transition: transform .12s, border-color .15s; }
.iconbtn:hover { border-color: var(--accent); }
.iconbtn:active { transform: scale(.92); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 6px 11px; font-weight: 700; font-size: 13px; cursor: pointer; transition: background .15s, color .15s; }
.seg button:hover { color: var(--ink); background: var(--card-2); }
.seg button[aria-pressed="true"] { background: var(--accent-2); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--card-2); color: var(--ink); border-radius: 7px; padding: 7px 13px; font-weight: 500; font-size: 13px; cursor: pointer; transition: transform .12s, border-color .15s, background .15s; white-space: nowrap; }
.btn:hover { border-color: var(--accent-2); }
.btn:active { transform: scale(.95); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); }
.btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.label { font-size: 11.5px; color: var(--muted); text-transform: lowercase; letter-spacing: .06em; font-weight: 700; margin: 0 0 6px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.panel h2 { margin: 0 0 10px; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
input[type=text], input[type=number], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
input.bad { border-color: var(--red); }
textarea { width: 100%; font-family: var(--f-mono); font-size: 12.5px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; font-size: 13.5px; user-select: none; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle .sw { width: 36px; height: 20px; flex: none; border-radius: 999px; background: var(--card-2); border: 1px solid var(--line); position: relative; transition: background .2s, border-color .2s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .2s cubic-bezier(.3,1.4,.5,1), background .2s; }
.toggle input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .sw::after { transform: translateX(16px); background: var(--accent-ink); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding: 16px; }

/* ---------- cards ---------- */
.card { --tc: var(--t-act); position: relative; width: 136px; height: 190px; flex: none; border-radius: 12px; background: var(--face);
  border: 1.5px solid color-mix(in srgb, var(--tc) 55%, var(--line)); box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--tc) 9%, transparent);
  display: flex; flex-direction: column; padding: 8px 9px 9px; overflow: hidden; transition: transform .15s, box-shadow .15s, border-color .15s; text-align: left; }
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 58%; background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 18%, transparent), transparent); pointer-events: none; }
.card.t-point { --tc: var(--t-point); } .card.t-point.neg { --tc: var(--t-neg); }
.card.t-ability { --tc: var(--t-ability); } .card.t-mutator { --tc: var(--t-mutator); } .card.t-character { --tc: var(--t-character); }
.ctop { display: flex; align-items: center; gap: 4px; font-size: 9.5px; font-weight: 700; text-transform: lowercase; letter-spacing: .08em; color: var(--tc); position: relative; }
.ctop .ccd, .ctop .ccopies { margin-left: auto; font-family: var(--f-mono); letter-spacing: 0; font-size: 11px; background: color-mix(in srgb, var(--tc) 16%, transparent); padding: 0 5px; border-radius: 5px; }
.ctop .ccd + .ccopies { margin-left: 3px; }
.cname { font-weight: 700; font-size: 13px; line-height: 1.2; margin-top: 3px; position: relative; text-wrap: balance; }
.cbig { flex: 1; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 34px; line-height: 1; color: var(--tc); position: relative; min-height: 0; letter-spacing: -.02em; }
.cbig.long { font-size: 25px; }
.ctext { font-size: 10.5px; line-height: 1.35; color: var(--muted); position: relative; max-height: 58px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.card.sm { width: 104px; height: 146px; padding: 6px 7px 7px; border-radius: 10px; }
.card.sm .cname { font-size: 11.5px; } .card.sm .cbig { font-size: 26px; } .card.sm .cbig.long { font-size: 19px; } .card.sm .ctext { font-size: 9.5px; -webkit-line-clamp: 3; max-height: 40px; }
.card.lg { width: 220px; height: 308px; padding: 12px 14px 14px; border-radius: 16px; }
.card.lg .ctop { font-size: 11px; } .card.lg .cname { font-size: 19px; } .card.lg .cbig { font-size: 58px; } .card.lg .cbig.long { font-size: 42px; }
.card.lg .ctext { font-size: 13px; max-height: none; -webkit-line-clamp: 8; color: var(--ink); opacity: .82; }
button.card { cursor: pointer; font: inherit; color: inherit; }
.card.can { cursor: pointer; }
.card.can:hover { transform: translateY(-6px); box-shadow: 0 8px 22px color-mix(in srgb, var(--tc) 30%, transparent), inset 0 0 0 4px color-mix(in srgb, var(--tc) 9%, transparent); }
.card.pick { border-color: var(--tc); animation: glow 1.4s ease-in-out infinite; }
.card.dim { opacity: .5; }
.card.cooling .cbig { opacity: .35; }
.card .cool { position: absolute; inset: auto 6px 6px; text-align: center; font: 700 11px var(--f-mono); background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; color: var(--muted); }
.card .ready { position: absolute; inset: auto 6px 6px; text-align: center; font: 700 11px var(--f-mono); background: var(--tc); color: var(--accent-ink); border-radius: 6px; padding: 2px 4px; }
.card.cooling .ctext, .card.isready .ctext { -webkit-line-clamp: 2; max-height: 28px; }
.cardback { width: 16px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(135deg, var(--accent-2) 0 3px, transparent 3px 6px); border: 1px solid var(--accent-2); opacity: .55; }
@keyframes glow { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--tc) 35%, transparent), inset 0 0 0 4px color-mix(in srgb, var(--tc) 9%, transparent); } }

/* ---------- setup ---------- */
.setup { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .setup { grid-template-columns: 1fr; } }
.prow { display: grid; grid-template-columns: 22px minmax(90px, 1fr) 150px minmax(110px, 1fr) 32px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.prow:first-of-type { border-top: 0; }
.prow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 25%, transparent); }
@media (max-width: 560px) { .prow { grid-template-columns: 22px 1fr 32px; } .prow .k, .prow .ch { grid-column: 2 / 3; } }
.presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.opts { display: grid; gap: 12px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.opt .what { min-width: 0; } .opt .what small { display: block; color: var(--muted); font-size: 12px; }
.opt input[type=number] { width: 76px; }
.charpeek { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; }

/* ---------- game ---------- */
.game { display: grid; gap: 12px; }
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.ptile { --pc: var(--accent); position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; min-width: 0; transition: border-color .2s, box-shadow .2s, transform .15s; }
.ptile.now { border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 22%, transparent); }
.ptile.can { cursor: pointer; animation: glow2 1.4s ease-in-out infinite; }
.ptile.can:hover { transform: translateY(-2px); }
@keyframes glow2 { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 40%, transparent); } }
.ptile .nmrow { display: flex; align-items: center; gap: 7px; min-width: 0; }
.ptile .nm { font-weight: 700; color: var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.ptile .turnmark { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--pc); white-space: nowrap; }
.ptile .score { display: flex; align-items: baseline; gap: 5px; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.ptile .score b { font: 700 30px/1.1 var(--f-mono); letter-spacing: -.02em; }
.ptile .score b.negs { color: var(--red); }
.ptile .score span { color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
.bar { height: 6px; background: var(--card-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pc); border-radius: 99px; transition: width .5s cubic-bezier(.3,1.2,.5,1); }
.ptile .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
.backs { display: flex; gap: 2px; align-items: center; margin-right: 4px; }
.backs .cardback { width: 10px; height: 14px; }
.chip { font-size: 11px; padding: 0 7px; border-radius: 6px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); line-height: 19px; white-space: nowrap; }
.chip.ab { color: var(--t-ability); border-color: color-mix(in srgb, var(--t-ability) 40%, var(--line)); }
.chip.ab.rdy { background: color-mix(in srgb, var(--t-ability) 18%, transparent); }
.chip.st { color: var(--ink); }
.chip.char { color: var(--t-character); border-color: color-mix(in srgb, var(--t-character) 40%, var(--line)); cursor: help; }
.float { position: fixed; z-index: 50; pointer-events: none; font: 700 26px var(--f-mono); animation: floatup 1.3s ease-out forwards; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
.float.up { color: var(--ok); } .float.down { color: var(--red); }
@keyframes floatup { from { opacity: 0; transform: translate(-50%, 6px) scale(.7); } 15% { opacity: 1; transform: translate(-50%, -6px) scale(1.15); } to { opacity: 0; transform: translate(-50%, -48px) scale(1); } }

.middle { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
@media (max-width: 860px) { .middle { grid-template-columns: 1fr; } }
.table { background: radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--accent) 7%, var(--card)), var(--card)); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; display: grid; grid-template-columns: auto auto 1fr; gap: 14px; align-items: start; min-width: 0; }
@media (max-width: 520px) { .table { grid-template-columns: auto auto; } .table .tinfo { grid-column: 1 / -1; } }
.slot { display: grid; gap: 6px; justify-items: start; }
.slot .empty { width: 104px; height: 146px; border: 1.5px dashed var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 11.5px; text-align: center; padding: 8px; }
.slot .card.just { animation: deal .45s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes deal { from { opacity: 0; transform: translateY(-14px) rotate(-6deg) scale(.9); } to { opacity: 1; transform: none; } }
.tinfo { display: grid; gap: 8px; min-width: 0; font-size: 13px; }
.tinfo .stat { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.tinfo .stat b { font-family: var(--f-mono); }
.dicebox { display: flex; gap: 6px; align-items: center; min-height: 40px; }
.bigdie { width: 38px; height: 38px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 20px var(--f-mono); box-shadow: 0 3px 0 color-mix(in srgb, var(--ink) 50%, var(--bg)); }
.bigdie.roll { animation: roll .5s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes roll { from { transform: rotate(-200deg) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.mods { display: flex; flex-wrap: wrap; gap: 5px; }
.mods .chip { color: var(--ink); border-color: var(--accent-2); background: var(--accent-soft); }
.log { background: var(--card); border: 1px solid var(--line); border-radius: 11px; display: flex; flex-direction: column; min-width: 0; max-height: 300px; min-height: 200px; }
.log h3 { margin: 0; padding: 9px 12px; font-size: 12px; text-transform: lowercase; letter-spacing: .06em; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; }
.log .lines { overflow-y: auto; padding: 6px 12px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.log .lines p { margin: 0; overflow-wrap: anywhere; }
.log .lines p.turn > span { white-space: nowrap; }
.log .lines p.turn { margin-top: 7px; font-weight: 700; font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.log .lines p.turn::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.log .lines p.win { font-weight: 700; color: var(--accent); }
.log .lines p.dim { color: var(--muted); }
.pn { color: var(--pc); }
.secret { color: var(--muted); font-size: 11.5px; }
.log [data-cid] { cursor: help; text-decoration: underline dotted color-mix(in srgb, currentColor 50%, transparent); text-underline-offset: 3px; }
.ctip { position: fixed; z-index: 60; pointer-events: none; filter: drop-shadow(0 10px 28px rgba(0,0,0,.45)); animation: fade .12s ease both; }
.cnm { color: var(--tc, var(--t-act)); }
.cnm.t-point { --tc: var(--t-point); } .cnm.t-point.neg { --tc: var(--t-neg); } .cnm.t-ability { --tc: var(--t-ability); } .cnm.t-mutator { --tc: var(--t-mutator); } .cnm.t-act { --tc: var(--t-act); }
.up { color: var(--ok); } .down { color: var(--red); }
.calc { color: var(--muted); font-family: var(--f-mono); font-size: 12px; margin-left: 4px; }
.calc i { font-style: normal; }
.die { display: inline-grid; place-items: center; min-width: 16px; height: 16px; padding: 0 3px; margin: 0 1px; border-radius: 4px; background: var(--ink); color: var(--bg); font: 700 11px var(--f-mono); vertical-align: 1px; }

.prompt { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--accent) 10%, var(--card)); border: 1px solid var(--accent-2); border-radius: 11px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.prompt.idle { background: var(--card); border-color: var(--line); }
.prompt .msg { font-weight: 500; min-width: 0; }
.prompt .msg small { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.prompt .choices { display: flex; flex-wrap: wrap; gap: 6px; }
.prompt .hintline { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.prompt .hintline b { color: var(--accent); }
.thinking::after { content: "…"; display: inline-block; animation: dots 1s steps(3) infinite; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }
.mine { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px 14px; display: grid; gap: 10px; min-width: 0; }
.mine .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mine .head .who { font-weight: 700; }
.hand { display: flex; gap: 10px; overflow-x: auto; padding: 8px 2px 6px; min-height: 204px; align-items: flex-end; }
.abil { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
.hidden-hand { color: var(--muted); padding: 30px 0; text-align: center; width: 100%; }

.overlay { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease both; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); width: min(920px, 100%); max-height: calc(100vh - 40px); overflow: auto; animation: pop .3s cubic-bezier(.2,.9,.3,1.15) both; }

/* ---------- replay bar ---------- */

@media (max-width: 560px) { .prow .newcell { grid-column: 2 / 3; } }

<script>
// ================= Hailey 100 engine (no DOM in here) =================
const CANCEL = { cancel: true };
const SIMSTOP = { simstop: true };
let CARD = {};
const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const signed = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const TYPES = {
  point: { label: 'Point', plural: 'Point cards' },
  act: { label: 'Act', plural: 'Act cards' },
  ability: { label: 'Ability', plural: 'Abilities' },
  mutator: { label: 'Mutator', plural: 'Mutators' },
  character: { label: 'Character', plural: 'Characters' },
};
const DECK_TYPES = ['point', 'act', 'ability', 'mutator'];

const TARGETS = {
  self: 'you', choose: 'a player you choose', chooseAny: 'any player you choose (even you)',
  others: 'everyone else', all: 'everyone', next: 'the next player', prev: 'the previous player',
  leader: 'the leader', last: 'whoever is in last place', random: 'a random other player',
};

const OPS = {
  points: { label: 'Gain or lose points', f: ['target', 'amount'] },
  transfer: { label: 'Take points from someone', f: ['target', 'amount'] },
  draw: { label: 'Draw cards', f: ['target', 'n'] },
  discard: { label: 'Discard random cards', f: ['target', 'n'] },
  steal: { label: 'Steal random cards', f: ['target', 'n'] },
  give: { label: 'Give cards away', f: ['target', 'n'] },
  skip: { label: 'Skip a turn', f: ['target'] },
  extraTurn: { label: 'Take another turn', f: [] },
  reverse: { label: 'Reverse turn order', f: [] },

  for (let i = 0; i < a.n; i++) { const r = rollDie(G, actor, a.sides); dice.push(r); sum += r; }
  io.fx({ type: 'dice', dice, sides: a.sides, pid: actor?.id });
  return { v: a.sign * sum, t: `${a.sign < 0 ? '−' : ''}${amtCore(a)} ${dice.map(dieHTML).join('')}` };
}

function applyRules(v, R, label, steps) {
  if (!R) return v;
  const v0 = v; const has = (k) => R[k] !== undefined && R[k] !== '' && R[k] !== null;
  if (R.flip) v = -v;
  if (has('mult')) v *= +R.mult;
  if (v > 0) { if (has('gainMult')) v *= +R.gainMult; if (+R.gainAdd) v += +R.gainAdd; }
  else if (v < 0) { if (has('lossMult')) v *= +R.lossMult; if (+R.lossReduce) v = Math.min(0, v + +R.lossReduce); }
  if (v !== v0) steps.push(`${esc(label)} ${signed(roundAway(v))}`);
  return v;
}
const roundAway = (v) => Math.sign(v) * Math.round(Math.abs(v));

function isReaction(def) { return !!def && (def.effects || []).some((e) => e.op === 'addToChange'); }

// the player whose turn it is may answer a point change with reaction cards (like inspire)
async function reactWindow(G, io, t, ch) {
  const p = G.turn && P(G, G.turn.pid); if (!p) return;
  for (let guard = 0; guard < 6 && !G.over; guard++) {
    const opts = p.hand.filter((c) => isReaction(CARD[c.c])).map((c) => 'c:' + c.u);
    if (!opts.length) return;
    const pick = await io.ask(p.id, { kind: 'react', options: ['pass', ...opts], tid: t.id, sign: ch.v < 0 ? -1 : 1,
      prompt: `${esc(t.name)} is about to ${ch.v < 0 ? 'lose' : 'gain'} ${Math.abs(ch.v)}. play a reaction?` });
    if (!pick || pick === 'pass') return;
    const ix = p.hand.findIndex((c) => 'c:' + c.u === pick); if (ix < 0) return;
    const inst = p.hand.splice(ix, 1)[0]; const def = CARD[inst.c];
    io.log(`${nm(p)} reacts with ${cn(inst.c)}`);
    G.table = { c: inst.c, by: p.id, sentBy: null };
    io.fx({ type: 'play', c: inst.c, pid: p.id });
    const prev = G.change; G.change = ch;
    await runEffects(G, io, p, def.effects || [], { name: def.name });
    G.change = prev;
    G.discard.push(inst);
    await io.delay('play');
  }
}

async function pointChange(G, io, t, base, actor) {
  const ch = { v: base.v, steps: [] };
  await reactWindow(G, io, t, ch);
  if (G.over) return 0;
  let v = ch.v; const steps = ch.steps;
  const tm = G.turn || { boost: [], next: [] };
  for (const b of tm.boost) {
    const r = rollAmount(G, io, actor, b.amt); const mag = Math.abs(r.v); const neg = v < 0;
    v += neg ? -mag : mag;
    steps.push(`${esc(b.name)} ${neg ? '−' : '+'}${r.t.replace(/^−/, '')} = ${signed(v)}`);
  }
  if (tm.next.length) { for (const n of tm.next) { v *= n.x; steps.push(`${esc(n.name)} ×${n.x} = ${signed(v)}`); } tm.next = []; }
  if (G.mutator) v = applyRules(v, CARD[G.mutator.c]?.rules, CARD[G.mutator.c]?.name || 'Mutator', steps);
  if (t.character) v = applyRules(v, CARD[t.character]?.rules, CARD[t.character]?.name || 'Character', steps);
  v = roundAway(v);
  if (v < 0 && t.shield > 0) { t.shield--; steps.push('blocked by a shield'); v = 0; }
  const before = t.points; t.points += v;
  if (t.points < 0 && (G.cfg.floor || anyRule(G, t, 'floor'))) t.points = 0;
  const d = t.points - before;
  const how = `<span class="calc">${base.t}${steps.length ? ' · ' + steps.join(' · ') : ''}</span>`;
  if (d === 0) io.log(`${nm(t)} ${v < 0 || base.v < 0 ? 'loses' : 'gains'} nothing ${how}`);
  else io.log(`${nm(t)} ${d > 0 ? 'gains' : 'loses'} <b class="${d > 0 ? 'up' : 'down'}">${Math.abs(d)}</b> ${how}`);
  io.fx({ type: 'pts', pid: t.id, d });
  checkWin(G, io);
  await io.delay('pts');
  return d;
}

function checkWin(G, io) {
  if (G.over) return;
  const won = G.players.filter((p) => p.points >= G.cfg.target);
  if (!won.length) return;
  const best = Math.max(...won.map((p) => p.points));
  const n = G.players.length;
  for (let i = 0; i < n; i++) { const p = G.players[(G.cur + i * G.dir + n * n) % n]; if (p.points === best) { G.winner = p.id; break; } }
  G.over = true;
  io.log(`${nm(P(G, G.winner))} reaches ${G.cfg.target} and wins!`, 'win');
}

function neighbor(G, p, dir) { const n = G.players.length; const i = G.players.indexOf(p); return G.players[(i + dir + n) % n]; }

function hintOf(e) {
  switch (e.op) {
    case 'points': return amtExp(e.amount) < 0 ? 'harm' : 'help';
    case 'transfer': case 'skip': case 'steal': case 'discard': return 'harm';
    case 'swapPoints': return 'swapPts';
    case 'swapHands': return 'swapHand';
    default: return 'help';
  }
}
const VERB = {
  points: (e) => (amtExp(e.amount) < 0 ? `lose ${amtCore(parseAmt(e.amount) || { n: 0, flat: '?' })}` : `gain ${amtCore(parseAmt(e.amount) || { n: 0, flat: '?' })}`),
  transfer: () => 'take points from', draw: () => 'draw cards', discard: () => 'discard', steal: () => 'steal from', give: () => 'give a card to',
  skip: () => 'skip a turn', swapPoints: () => 'swap points with', swapHands: () => 'swap hands with', shield: () => 'shield', refresh: () => 'refresh',
};

async function askPlayer(G, io, actor, list, hint, prompt) {
  if (!list.length) return null;
  if (list.length === 1 && io.sim) return list[0];
  const id = await io.ask(actor.id, { kind: 'player', options: list.map((p) => p.id), hint, prompt });
  return P(G, id) || list[0];
}

async function resolveTargets(G, io, actor, e, src) {
  const tgt = e.target || 'self';
  const others = G.players.filter((p) => p !== actor);
  const prompt = `${esc(src.name)}: choose who will ${(VERB[e.op] || (() => 'be targeted'))(e)}`;
  switch (tgt) {
    case 'self': return [actor];
    case 'choose': { const p = await askPlayer(G, io, actor, others, hintOf(e), prompt); return p ? [p] : []; }
    case 'chooseAny': { const p = await askPlayer(G, io, actor, G.players, hintOf(e), prompt); return p ? [p] : []; }
    case 'others': return others;
    case 'all': return G.players.slice();
    case 'next': return [neighbor(G, actor, G.dir)];
    case 'prev': return [neighbor(G, actor, -G.dir)];
    case 'leader': { const m = Math.max(...G.players.map((p) => p.points)); return G.players.filter((p) => p.points === m); }
    case 'last': { const m = Math.min(...G.players.map((p) => p.points)); return G.players.filter((p) => p.points === m); }
    case 'random': return others.length ? [others[rnd(others.length)]] : [];
  }
  return [actor];
}

async function runEffects(G, io, actor, list, src) {
  for (const e of list || []) { if (G.over) return; await runEffect(G, io, actor, e, src); }
}

async function runEffect(G, io, actor, e, src) {
  const n = Math.max(0, +e.n || 1);
  switch (e.op) {
    case 'points': {
      for (const t of await resolveTargets(G, io, actor, e, src)) { if (G.over) return; await pointChange(G, io, t, rollAmount(G, io, actor, e.amount), actor); }
      return;
    }
    case 'transfer': {
      for (const t of await resolveTargets(G, io, actor, e, src)) {
        if (t === actor || G.over) continue;
        const r = rollAmount(G, io, actor, e.amount); const mag = Math.abs(r.v); const t2 = r.t.replace(/^−/, '');
        await pointChange(G, io, t, { v: -mag, t: '−' + t2 }, actor);
        if (!G.over) await pointChange(G, io, actor, { v: mag, t: '+' + t2 }, actor);
      }
      return;
    }
    case 'draw': for (const t of await resolveTargets(G, io, actor, e, src)) { const g = drawCards(G, t, n, true); if (!g && !roomIn(G, t)) { io.log(`${nm(t)} has a full hand, so draws nothing`); continue; } const pub = `${nm(t)} draws ${plural(g, 'card')}${g < n && !roomIn(G, t) ? ' (hand full)' : ''}`; io.log(pub, null, g > 1 ? priv([t.id], `${pub}: ${cardList(LASTDRAWN)}`) : null); } return;
    case 'discard':
      for (const t of await resolveTargets(G, io, actor, e, src)) {
        const gone = [];
        for (let i = 0; i < n && t.hand.length; i++) { const c = t.hand.splice(rnd(t.hand.length), 1)[0]; G.discard.push(c); gone.push(cn(c.c)); }
        io.log(gone.length ? `${nm(t)} discards ${gone.join(', ')}` : `${nm(t)} has nothing to discard`);
      }
      return;
    case 'steal':
      for (const t of await resolveTargets(G, io, actor, e, src)) {
        if (t === actor) continue; let k = 0; const took = [];
        for (let i = 0; i < n && t.hand.length && roomIn(G, actor); i++) { const c = t.hand.splice(rnd(t.hand.length), 1)[0]; actor.hand.push(c); took.push(c); k++; }
        const pub = `${nm(actor)} steals ${plural(k, 'card')} from ${nm(t)}`;
        io.log(k ? pub : !roomIn(G, actor) ? `${nm(actor)} has a full hand, so can't steal` : `${nm(t)} has no cards to steal`, null, k ? priv([actor.id, t.id], `${pub}: ${cardList(took)}`) : null);
      }
      return;
    case 'give':
      for (const t of await resolveTargets(G, io, actor, e, src)) {
        if (t === actor) continue;
        if (!roomIn(G, t)) { io.log(`${nm(t)} has a full hand, so can't take a gift`); continue; }
        for (let i = 0; i < n && actor.hand.length && roomIn(G, t); i++) {
          const u = await io.ask(actor.id, { kind: 'card', purpose: 'give', options: actor.hand.map((c) => c.u), prompt: `${esc(src.name)}: choose a card to give to ${esc(t.name)}` });
          const ix = Math.max(0, actor.hand.findIndex((c) => c.u === u));
          const c = actor.hand.splice(ix, 1)[0]; t.hand.push(c);
          io.log(`${nm(actor)} gives a card to ${nm(t)}`, null, priv([actor.id, t.id], `${nm(actor)} gives ${cn(c.c)} to ${nm(t)}`));
        }
      }
      return;
    case 'skip': for (const t of await resolveTargets(G, io, actor, e, src)) { t.skip++; io.log(`${nm(t)} will skip their next turn`); } return;
    case 'extraTurn': actor.extra++; io.log(`${nm(actor)} gets another turn after this one`); return;
    case 'reverse': G.dir *= -1; io.log('Turn order is reversed'); return;
    case 'swapPoints':
      for (const t of await resolveTargets(G, io, actor, e, src)) { if (t === actor) continue; [t.points, actor.points] = [actor.points, t.points]; io.log(`${nm(actor)} and ${nm(t)} swap points`); io.fx({ type: 'pts', pid: t.id, d: 0 }); checkWin(G, io); }
      return;
    case 'swapHands':
      for (const t of await resolveTargets(G, io, actor, e, src)) { if (t === actor) continue; [t.hand, actor.hand] = [actor.hand, t.hand]; io.log(`${nm(actor)} and ${nm(t)} swap hands`); trimHand(G, io, actor); trimHand(G, io, t); }
      return;
    case 'send': {
      const others = G.players.filter((p) => p !== actor);
      if (!actor.hand.length || !others.length) { io.log(`${nm(actor)} has nothing to send`); return; }
      const u = await io.ask(actor.id, { kind: 'card', purpose: 'send', options: actor.hand.map((c) => c.u), prompt: `${esc(src.name)}: choose a card to send` });
      const ix = Math.max(0, actor.hand.findIndex((c) => c.u === u));
      const card = actor.hand[ix];
      const hint = staticValue(CARD[card.c]) < 0 ? 'harm' : 'help';
      const t = await askPlayer(G, io, actor, others, hint, `${esc(src.name)}: who plays ${esc(CARD[card.c]?.name)}?`);
      actor.hand.splice(actor.hand.indexOf(card), 1);
      await playCard(G, io, t, card, { sentBy: actor });
      return;
    }
    case 'echo': {
      const d = G.last && CARD[G.last];
      if (!d) { io.log('There is nothing to echo yet'); return; }
      io.log(`${nm(actor)} echoes ${cn(G.last)}`);
      await runEffects(G, io, actor, d.effects, { name: d.name });
      return;
    }
    case 'shield': for (const t of await resolveTargets(G, io, actor, e, src)) {
      if (t.shield > 0 && G.cfg.shieldStack === false) { io.log(`${nm(t)} already has a shield, and shields don't stack`); continue; }
      t.shield++; io.log(`${nm(t)} is shielded from the next loss${t.shield > 1 ? ` (${t.shield} shields)` : ''}`);
    } return;
    case 'clearMutator':
      if (G.mutator) { io.log(`${cn(G.mutator.c)} is removed`); G.discard.push(G.mutator); G.mutator = null; } else io.log('There is no mutator to remove');
      return;
    case 'addToChange': {
      const ch = G.change;
      if (!ch) { io.log(`${esc(src.name)} has no point change to add to`, 'dim'); return; }
      const r = rollAmount(G, io, actor, e.amount || '1d6'); const mag = Math.abs(r.v); const neg = ch.v < 0;
      ch.v += neg ? -mag : mag;
      ch.steps.push(`${esc(src.name)} ${neg ? '−' : '+'}${r.t.replace(/^−/, '')} = ${signed(ch.v)}`);
      return;
    }
    case 'boost': if (G.turn) { G.turn.boost.push({ amt: e.amount || '1d6', name: src.name }); io.log(`${esc(src.name)}: every point change this turn is ${amtCore(parseAmt(e.amount || '1d6') || { n: 0, flat: '?' })} bigger`); } return;
    case 'double': if (G.turn) { G.turn.next.push({ x: +e.x || 2, name: src.name }); io.log(`${esc(src.name)}: the next point change is ×${+e.x || 2}`); } return;
    case 'refresh': for (const t of await resolveTargets(G, io, actor, e, src)) { t.abilities.forEach((a) => (a.cd = 0)); io.log(`${nm(t)}'s abilities are ready`); } return;
    case 'mulligan': {
      const k = actor.hand.length; G.discard.push(...actor.hand); actor.hand = [];
      const g = drawCards(G, actor, k + (+e.n || 0), true); const pub = `${nm(actor)} redraws ${plural(g, 'card')}`;
      io.log(pub, null, g > 1 ? priv([actor.id], `${pub}: ${cardList(LASTDRAWN)}`) : null); return;
    }
    case 'if': {
      let ok = false; const v = +(e.v ?? COND_NEEDS_V[e.cond]);
      const all = G.players.map((p) => p.points);
      switch (e.cond) {
        case 'roll': { const r = rollDie(G, actor, 6); io.fx({ type: 'dice', dice: [r], sides: 6, pid: actor.id }); ok = r >= v; io.log(`${nm(actor)} rolls ${dieHTML(r)} ${ok ? '(success)' : '(no luck)'}`); break; }
        case 'lastPlace': ok = actor.points <= Math.min(...all); break;
        case 'firstPlace': ok = actor.points >= Math.max(...all); break;
        case 'mutator': ok = !!G.mutator; break;
        case 'below': ok = actor.points < v; break;
        case 'above': ok = actor.points >= v; break;
        case 'handLE': ok = actor.hand.length <= v; break;
      }
      await runEffects(G, io, actor, ok ? e.then : e.else, src);
      return;
    }
  }
}

async function playCard(G, io, p, inst, opt = {}) {
  const def = CARD[inst.c];
  if (!def) { G.discard.push(inst); return; }
  io.log(`${nm(p)} plays ${cn(inst.c)}${opt.sentBy ? ` (sent by ${nm(opt.sentBy)})` : ''}`);
  G.table = { c: inst.c, by: p.id, sentBy: opt.sentBy ? opt.sentBy.id : null };
  io.fx({ type: 'play', c: inst.c, pid: p.id });
  await io.delay('play');
  if (def.type === 'ability') { p.abilities.push({ u: inst.u, c: inst.c, cd: 0 }); io.log(`${cn(inst.c)} is ready for ${nm(p)} to use`); return; }
  if (def.type === 'mutator') {
    if (G.mutator) { io.log(`${cn(G.mutator.c)} is replaced`); G.discard.push(G.mutator); }
    G.mutator = inst; io.log(`${cn(inst.c)} is now in play: ${esc(cardText(def))}`); return;
  }
  await runEffects(G, io, p, def.effects || [], { name: def.name });
  if (!hasOp(def.effects, 'echo')) G.last = inst.c;
  G.discard.push(inst);
}

async function useAbility(G, io, p, ab) {
  const def = CARD[ab.c]; if (!def || ab.cd > 0) return;
  ab.cd = Math.max(0, +def.cooldown || 0);
  io.log(`${nm(p)} uses ${cn(ab.c)}`);
  io.fx({ type: 'play', c: ab.c, pid: p.id });
  await runEffects(G, io, p, def.effects || [], { name: def.name });
}

function maxPlays(G, p) { return 1 + sumRule(G, p, 'extraPlays'); }
function actionOptions(G, p) {
  const opts = p.abilities.filter((a) => a.cd === 0 && CARD[a.c]).map((a) => 'a:' + a.u);
  const canPlay = G.turn.plays < maxPlays(G, p);
  if (canPlay) for (const c of p.hand) opts.push('c:' + c.u);
  const mayEnd = !canPlay || !p.hand.length || G.turn.plays > 0 || G.cfg.allowPass;
  if (mayEnd) opts.push('end');
  if (!canPlay && opts.length === 1) return [];
  return opts;
}

function startTurn(G, io) {
  const p = G.players[G.cur]; G.turnNo++;
  G.turn = { pid: p.id, plays: 0, boost: [], next: [] };
  io.log(`${nm(p)}'s turn`, 'turn');
  if (p.skip > 0) { p.skip--; io.log(`${nm(p)} skips this turn`); return false; }
  const g = drawCards(G, p, 1 + sumRule(G, p, 'extraDraw'), true);
  if (!g) io.log(`${nm(p)} ${p.hand.length >= handLimit(G, p) ? 'has a full hand' : 'has nothing to draw'}`, 'dim');
  else if (g > 1) io.log(`${nm(p)} draws ${g} cards`, 'dim', priv([p.id], `${nm(p)} draws ${cardList(LASTDRAWN)}`));
  return true;
}

async function actionLoop(G, io) {
  let guard = 0;
  while (!G.over && guard++ < 60) {
    const p = G.players[G.cur];
    const opts = actionOptions(G, p);
    if (!opts.length || (opts.length === 1 && opts[0] === 'end')) break;
    const pick = await io.ask(p.id, { kind: 'action', options: opts });
    if (!pick || pick === 'end') break;
    if (pick.startsWith('a:')) {
      const ab = p.abilities.find((a) => 'a:' + a.u === pick);
      if (ab) await useAbility(G, io, p, ab);
      continue;
    }
    const ix = p.hand.findIndex((c) => 'c:' + c.u === pick);
    if (ix < 0) continue;
    const snap = io.snapshot ? io.snapshot(G) : null;
    try {
      const inst = p.hand.splice(ix, 1)[0];
      G.turn.plays++;
      await playCard(G, io, p, inst);
    } catch (err) {
      if (err === CANCEL && snap) { io.restore(G, snap); continue; }
      throw err;
    }
    if (io.endSnapshot) io.endSnapshot();
  }
}

function endTurn(G, io) {
  for (const p of G.players) trimHand(G, io, p);
  for (const p of G.players) {
    const tick = Math.max(1, Math.round(mulRule(G, p, 'cooldownTick')));
    for (const a of p.abilities) a.cd = Math.max(0, a.cd - tick);
  }
  G.turn = null;
  const p = G.players[G.cur];
  if (p.extra > 0 && !G.over) { p.extra--; io.log(`${nm(p)} goes again`); return; }
  const n = G.players.length;
  G.cur = (G.cur + G.dir + n) % n;
}

// the turn rule: every N turns without a winner, everyone votes. any vote to continue plays N more,
// a unanimous standings vote ends it with the leader winning, any other mix of end votes is a tie
const VOTES = { continue: 'keep playing', tie: 'end it as a tie', standings: 'end it on the current standings' };
async function turnCheck(G, io) {
  const n = +G.cfg.turnCheck || 0; if (!n || G.over) return;
  if (G.turnNo < (G.nextCheck || n)) return;
  G.nextCheck = G.turnNo + n;
  io.log(`${G.turnNo} turns and nobody has ${G.cfg.target} yet, so everyone votes: end it as a tie, end it on the current standings, or play up to ${n} more turns.`, 'dim');
  const votes = [];
  for (const p of seatOrder(G)) {
    const v = await io.ask(p.id, { kind: 'vote', options: Object.keys(VOTES), prompt: `${G.turnNo} turns are up. How do you want to go on?` });
    votes.push(VOTES[v] ? v : 'continue'); io.log(`${nm(p)} votes to ${VOTES[votes[votes.length - 1]]}`);
    await io.delay('pre');
  }
  if (votes.includes('continue')) { io.log(`Playing on for up to ${n} more turns.`, 'dim'); return; }
  const top = Math.max(...G.players.map((p) => p.points)); const leaders = G.players.filter((p) => p.points === top);
  G.over = true;
  if (votes.every((v) => v === 'standings') && leaders.length === 1) { G.winner = leaders[0].id; G.result = 'standings'; io.log(`Everyone agrees to stop. ${nm(leaders[0])} wins on the standings with ${top}!`, 'win'); }
  else { G.winner = null; G.result = 'tie'; io.log(`Everyone agrees to stop, and the game ends in a tie.`, 'win'); }
}

// ================= Bots =================
const BOT = {
  easy: { cap: 40, samples: 1, noise: 9 },
  normal: { cap: 260, samples: 2, noise: 0.6 },
  hard: { cap: 900, samples: 4, noise: 0 },
};

function evalState(G, pid) {
  const me = P(G, pid); const T = G.cfg.target;
  if (G.over) return G.winner === pid ? 1e5 : -1e5 + me.points;
  const opps = G.players.filter((p) => p !== me);
  let s = me.points;
  if (opps.length) {
    const mx = Math.max(...opps.map((p) => p.points));
    const avg = opps.reduce((a, p) => a + p.points, 0) / opps.length;
    s -= 0.65 * mx + 0.35 * avg;
    if (mx > T - 25) s -= (mx - (T - 25)) * 0.8;
    for (const o of opps) s += o.skip * 4 - o.extra * 5 - o.shield * 1.5 - Math.min(o.hand.length, 8) * 0.5;
  }
  if (me.points > T - 20) s += (me.points - (T - 20)) * 0.3;
  for (const c of me.hand) s += 1.4 + Math.max(-1.5, Math.min(3, staticValue(CARD[c.c]) * 0.25));
  for (const a of me.abilities) s += 5 - Math.min(4, a.cd * 0.6);
  s += me.shield * 3 + me.extra * 7 - me.skip * 7;
  if (G.mutator) {
    const r = CARD[G.mutator.c]?.rules || {};
    const chaos = (+r.mult > 1 ? 1 : 0) + (r.flip ? 1 : 0) - (+r.mult && +r.mult < 1 ? 1 : 0);
    const lead = opps.length ? me.points - Math.max(...opps.map((p) => p.points)) : 0;
    s += chaos * (lead < 0 ? 3 : -3);
  }
  return s;
}

function heuristic(G, pid, req) {
  const me = P(G, pid);
  if (req.kind === 'action') {
    let best = req.options[0], bv = -1e9;
    for (const o of req.options) {
      let v = o === 'end' ? -2 : 0;
      if (o.startsWith('a:')) v = 4;
      if (o.startsWith('c:')) { const c = me.hand.find((h) => 'c:' + h.u === o); v = staticValue(CARD[c?.c]); }
      if (v > bv) { bv = v; best = o; }
    }
    return best;
  }
  if (req.kind === 'player') {
    const ps = req.options.map((id) => P(G, id));
    const others = ps.filter((p) => p.id !== pid);
    const pool = others.length ? others : ps;
    switch (req.hint) {
      case 'harm': return pool.slice().sort((a, b) => b.points - a.points)[0].id;
      case 'help': return ps.some((p) => p.id === pid) ? pid : ps.slice().sort((a, b) => a.points - b.points)[0].id;
      case 'swapPts': return pool.slice().sort((a, b) => b.points - a.points)[0].id;
      case 'swapHand': return pool.slice().sort((a, b) => b.hand.length - a.hand.length)[0].id;
    }
    return pool[0].id;
  }
  if (req.kind === 'react') return (req.tid === pid) === (req.sign > 0) ? req.options[1] : 'pass';
  if (req.kind === 'vote') {
    const opps = G.players.filter((p) => p !== me); const lead = me.points - Math.max(...opps.map((p) => p.points)); const T = G.cfg.target;
    // a clear leader wants it over, someone far behind concedes, a close game plays on for a while before settling for a tie
    if (lead >= T * 0.1 || lead <= -T * 0.4) return 'standings';
    return G.turnNo >= 3 * (+G.cfg.turnCheck || 50) ? 'tie' : 'continue';
  }
  if (req.kind === 'draft') {
    const noise = { easy: 3, normal: 0.8, hard: 0 }[me.diff] ?? 0.8;
    let best = req.options[0], bv = -1e9;
    for (const id of req.options) { const v = draftValue(G, pid, id, req.purpose) + (Math.random() * 2 - 1) * noise; if (v > bv) { bv = v; best = id; } }
    return best;
  }
  if (req.kind === 'card') {
    let best = req.options[0], bv = 1e9;
    for (const u of req.options) { const c = me.hand.find((h) => h.u === u); const v = staticValue(CARD[c?.c]); if (v < bv) { bv = v; best = u; } }
    return best;
  }
  return req.options[0];
}

function optLabel(G, pid, req, o) {
  const me = P(G, pid);
  if (req.kind === 'action') {
    if (o === 'end') return 'end your turn';
    if (o.startsWith('a:')) { const a = me.abilities.find((x) => 'a:' + x.u === o); return `use ${CARD[a?.c]?.name}`; }
    const c = me.hand.find((x) => 'c:' + x.u === o); return `play ${CARD[c?.c]?.name}`;
  }
  if (req.kind === 'player') return `pick ${P(G, o)?.name}`;
  if (req.kind === 'react') { if (o === 'pass') return 'let it land'; const c = me.hand.find((x) => 'c:' + x.u === o); return `react with ${CARD[c?.c]?.name}`; }
  if (req.kind === 'card') { const c = me.hand.find((x) => x.u === o); return `${req.purpose || 'pick'} ${CARD[c?.c]?.name}`; }
  return String(o);
}

async function simRun(G0, pid, prefix, deep) {
  const G = clone(G0); let k = 0, steps = 0, peek = false; const seq = [], labels = [];
  const io = {
    sim: true, log() {}, fx() {}, delay() {},
    ask(id, req) {
      if (++steps > 300) throw SIMSTOP;
      if (id === pid && !peek) {
        let i = k < prefix.length ? prefix[k] : 0; if (i >= req.options.length) i = 0;
        seq.push({ i, n: req.options.length, kind: req.kind }); labels.push(optLabel(G, pid, req, req.options[i])); k++;
        return req.options[i];
      }
      return heuristic(G, id, req);
    },
  };
  try {
    await actionLoop(G, io);
    if (deep && !G.over) {
      // peek at the next player's turn, played greedily, so the bot sees what it leaves open
      const rolls = G.rolls; const now = evalState(G, pid);
      endTurn(G, io); peek = true;
      if (G.players[G.cur].id !== pid && startTurn(G, io)) await actionLoop(G, io);
      return { seq, labels, score: (now + evalState(G, pid)) / 2, rolled: true };
    }
  } catch (e) { if (e !== SIMSTOP) throw e; }
  return { seq, labels, score: evalState(G, pid), rolled: G.rolls !== G0.rolls };
}

async function botPlan(G, pid, diff) {
  const B = BOT[diff] || BOT.normal;
  const leaves = []; const queue = [[]]; const seen = new Set();
  let runs = 0;
  while (queue.length && leaves.length < B.cap && runs < B.cap * 3) {
    const prefix = queue.shift(); runs++;
    const r = await simRun(G, pid, prefix, B.deep);
    const key = r.seq.map((x) => x.i).join(',');
    if (seen.has(key)) continue; seen.add(key);
    const leaf = { seq: r.seq.map((x) => x.i), kinds: r.seq.map((x) => x.kind), labels: r.labels, total: r.score, n: 1, rolled: r.rolled };
    leaves.push(leaf);
    for (let j = prefix.length; j < r.seq.length; j++) for (let kk = 1; kk < r.seq[j].n; kk++) queue.push([...leaf.seq.slice(0, j), kk]);
  }
  for (const L of leaves) if (L.rolled) for (let i = 1; i < B.samples; i++) { const r = await simRun(G, pid, L.seq, B.deep); L.total += r.score; L.n++; }
  let best = null, bv = -Infinity;
  for (const L of leaves) {
    const v = L.total / L.n + (B.noise ? (Math.random() * 2 - 1) * B.noise : 0);
    if (v > bv) { bv = v; best = L; }
  }
  return best || { seq: [], kinds: [], labels: [] };
}

<script>
// =============== ONLINE ===============
// one person hosts and their browser runs the game. guests join with a room code and connect straight to the host
// (peer to peer, through peerjs). guests only ever get their own view: other hands are blanked out and private log
// lines are resolved for them before they're sent.
const NET = {
  role: null, peer: null, code: '', status: '', guests: [], pending: new Map(), askId: 0,
  opts: { pass: '', max: 4, spectators: true, timer: 0 },
  io: null, game: null,
  // guest side
  conn: null, pid: null, myRole: null, myName: '', lobby: null, started: false, view: null, log: [], ask: null, answered: null, hl: '', hlFull: '', looked: false,
};
const NETCHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const NETCOLORS = ['#00f0f0', '#ff6fb5', '#ffb84d', '#b388ff', '#3fb950', '#ff8a5b', '#5b8cff', '#f5e050'];
const isGuest = () => NET.role === 'guest';
const isHost = () => NET.role === 'host';
const okColor = (c) => /^#[0-9a-f]{6}$/i.test(c || '');
function netCfg() { try { const j = JSON.parse(store.get('h100.peerserver')); if (j && typeof j === 'object') return j; } catch {} return {}; }
function netErr(e) {
  return { 'peer-unavailable': 'there is no open room with that code', network: "couldn't reach the connection server. check your internet", 'browser-incompatible': "this browser can't play online", 'server-error': 'the connection server had a problem', 'socket-error': "couldn't reach the connection server", 'socket-closed': 'the connection server closed the connection' }[e?.type] || e?.message || String(e);
}
function netSend(conn, m) { try { if (conn && conn.open) conn.send(m); } catch {} }
function netGuestFor(p) { return NET.guests.find((g) => g.seat === p && g.conn.open); }
function netReady() { if (typeof Peer === 'function') return true; toast("Online play couldn't start: the connection library didn't load."); return false; }

// ---------------- host ----------------
function netHost() {
  if (!netReady()) return;
  netClose(true);
  NET.role = 'host'; NET.status = 'opening';
  NET.code = Array.from({ length: 5 }, () => NETCHARS[rnd(NETCHARS.length)]).join('');
  const peer = new Peer('h100-' + NET.code, { debug: 0, ...netCfg() });
  NET.peer = peer;
  peer.on('open', () => { NET.status = 'open'; render(); });
  peer.on('connection', (conn) => netAccept(conn));
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') { netHost(); return; }
    if (e.type === 'peer-unavailable') return;
    toast('Online: ' + netErr(e)); if (NET.status !== 'open') { netClose(true); } render();
  });
  peer.on('disconnected', () => { if (NET.peer === peer && !peer.destroyed) try { peer.reconnect(); } catch {} });
  render();
}
function netAccept(conn) {
  const g = { conn, name: '', role: null, seat: null, pid: null, sent: 0, logGame: null, fx: [] };
  conn.on('data', (m) => netFromGuest(g, m));
  conn.on('close', () => netGone(g));
  conn.on('error', () => netGone(g));
}
const peopleCount = () => SETUP.players.filter((p) => p.kind === 'human' || p.kind === 'remote').length;
function netLiveG() { return NET.io && !NET.io.dead && NET.io.g && !NET.io.g.over ? NET.io.g : null; }
function uniqueName(name) {
  const taken = new Set([...SETUP.players.map((p) => p.name.toLowerCase()), ...NET.guests.map((g) => g.name.toLowerCase())]);
  let n = name, k = 2; while (taken.has(n.toLowerCase())) n = `${name.slice(0, 15)} ${k++}`; return n;
}
function freeColor() { const used = new Set(SETUP.players.map((p, i) => (p.color || PCOLORS[i % PCOLORS.length]).toLowerCase())); return NETCOLORS.find((c) => !used.has(c)) || NETCOLORS[rnd(NETCOLORS.length)]; }
function netFromGuest(g, m) {
  if (!m || typeof m !== 'object' || !isHost()) return;
  if (m.t === 'hello') {
    if (g.role) return;
    if (NET.opts.pass && String(m.pass || '') !== NET.opts.pass) { netSend(g.conn, { t: 'refuse', why: 'That password is wrong.' }); setTimeout(() => g.conn.close(), 400); return; }
    const want = String(m.name || '').trim().slice(0, 18) || 'Guest';
    const LG = netLiveG();
    // someone who dropped out can come back to their seat by joining with the same name
    const back = LG && !m.watch && LG.players.find((p) => p.dropped && p.name.toLowerCase() === want.toLowerCase());
    if (back) {
      back.bot = false; back.remote = true; delete back.dropped;
      Object.assign(g, { name: back.name, role: 'player', pid: back.id, seat: SETUP.players.find((p) => p.kind === 'remote' && p.name === back.name) || null });
      NET.io.log(`${nm(back)} is back`, 'dim');
    } else if (!m.watch && !LG && !(G && GIO && !G.over && NET.game === GAME) && peopleCount() < NET.opts.max && SETUP.players.length < 6) {
      g.name = uniqueName(want); g.role = 'player';
      g.seat = { name: g.name, kind: 'remote', diff: 'normal', character: '', color: okColor(m.color) && !SETUP.players.some((p) => (p.color || '').toLowerCase() === m.color.toLowerCase()) ? m.color : freeColor() };
      SETUP.players.push(g.seat);
    } else if (NET.opts.spectators) { g.name = uniqueName(want); g.role = 'spectator'; }
    else { netSend(g.conn, { t: 'refuse', why: LG ? 'The game has already started.' : 'The room is full.' }); setTimeout(() => g.conn.close(), 400); return; }
    NET.guests.push(g);
    toast(back ? `${g.name} is back.` : `${g.name} joined${g.role === 'spectator' ? ' to watch' : ''}.`);
    netSend(g.conn, { t: 'welcome', role: g.role, name: g.name });
    netLobby();
    if (NET.game && (LG || (G && G.over && NET.game === GAME))) netStartFor(g);
    render();
  } else if (m.t === 'answer') {
    const pend = NET.pending.get(g.pid);
    if (!pend || g.role !== 'player' || pend.id !== m.id || !pend.req.options.some((o) => o === m.v)) return;
    NET.pending.delete(g.pid); clearTimeout(pend.timer); pend.res(m.v); netSchedule();
  } else if (m.t === 'color' && g.seat && okColor(m.color) && !netLiveG()) { g.seat.color = m.color; netLobby(); render(); }
  else if (m.t === 'bye') g.conn.close();
}
function netGone(g) {
  if (!NET.guests.includes(g)) return;
  NET.guests = NET.guests.filter((x) => x !== g);
  const LG = netLiveG();
  if (g.role === 'player' && LG && g.pid != null) {
    // a bot takes over until they come back
    const p = P(LG, g.pid);
    if (p && p.remote) {
      p.remote = false; p.bot = true; p.dropped = true; p.diff = p.diff || 'normal';
      NET.io.log(`${nm(p)} left, so a bot plays for them until they rejoin with the same name`, 'dim');
      const pend = NET.pending.get(g.pid); if (pend) { NET.pending.delete(g.pid); clearTimeout(pend.timer); pend.res(heuristic(LG, g.pid, pend.req)); }
    }
  } else if (g.seat && !LG) SETUP.players = SETUP.players.filter((p) => p !== g.seat);
  if (isHost()) toast(`${g.name || 'Someone'} left the room.`);
  netLobby(); render();
}
function netKick(p) { const g = NET.guests.find((x) => x.seat === p); if (g) { netSend(g.conn, { t: 'kick' }); setTimeout(() => g.conn.close(), 300); } }
function netLobby() {
  if (!isHost()) return;
  const f = curFormat();
  const room = {
    code: NET.code, host: SETUP.players.find((p) => p.kind === 'human')?.name || 'the host',
    players: SETUP.players.map((p, i) => ({ name: p.name, color: p.color || PCOLORS[i % PCOLORS.length], kind: p.kind, diff: p.diff, character: p.character && CARD[p.character] ? CARD[p.character].name : p.character === 'random' ? 'random character' : '' })),
    spectators: NET.guests.filter((g) => g.role === 'spectator').map((g) => g.name),
    format: f.name, about: f.about || '', notes: formatNotes(f), target: SETUP.rules.target,
    opts: { max: NET.opts.max, timer: NET.opts.timer, spectators: NET.opts.spectators, pass: !!NET.opts.pass },
    inGame: !!(NET.game && NET.game === GAME && G),
  };
  for (const g of NET.guests) netSend(g.conn, { t: 'lobby', room, you: g.name });
}
function netClose(silent) {
  if (isHost()) {
    for (const g of NET.guests) netSend(g.conn, { t: 'closed' });
    SETUP.players = SETUP.players.filter((p) => p.kind !== 'remote' || netLiveG());
    for (const [, pend] of NET.pending) clearTimeout(pend.timer);
    // anyone still online in a running game is handed to a bot
    const LG = netLiveG(); if (LG) for (const p of LG.players) if (p.remote) { p.remote = false; p.bot = true; p.dropped = true; }
    for (const [pid, pend] of NET.pending) if (LG) pend.res(heuristic(LG, pid, pend.req));
  }
  if (isGuest()) netSend(NET.conn, { t: 'bye' });
  const peer = NET.peer;
  if (peer) setTimeout(() => { try { peer.destroy(); } catch {} }, 300);
  Object.assign(NET, { role: null, peer: null, code: '', status: '', guests: [], pending: new Map(), io: null, game: null, conn: null, pid: null, myRole: null, lobby: null, started: false, view: null, log: [], ask: null, answered: null, hl: '', hlFull: '', looked: false });

function idb() { return new Promise((res, rej) => { const r = indexedDB.open('hailey100', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch { return null; } }
async function idbSet(k, v) { try { const db = await idb(); await new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch {} }
async function dirOf(sub, create) { let d = FOLDER.handle; if (sub) d = await d.getDirectoryHandle(sub, { create: !!create }); return d; }
async function writeFile(name, data, sub) {
  const d = await dirOf(sub, true); const fh = await d.getFileHandle(name, { create: true });
  const w = await fh.createWritable(); await w.write(typeof data === 'string' ? data : JSON.stringify(data, null, 1)); await w.close();
}
async function listFiles(sub) {
  const out = []; let d; try { d = await dirOf(sub, false); } catch { return out; }
  for await (const [name, h] of d.entries()) if (h.kind === 'file' && /\.json$/i.test(name)) { try { const f = await h.getFile(); out.push({ name, modified: f.lastModified, size: f.size, h }); } catch {} }
  return out.sort((a, b) => b.modified - a.modified);
}
async function readJSONFiles(sub) {
  const out = []; let d; try { d = await dirOf(sub, false); } catch { return out; }
  for await (const [name, h] of d.entries()) {
    if (h.kind !== 'file' || !/\.json$/i.test(name)) continue;
    try { const f = await h.getFile(); out.push({ name, json: JSON.parse(await f.text()), modified: f.lastModified }); } catch (e) { out.push({ name, error: e.message }); }
  }
  return out.sort((a, b) => a.name.localeCompare(b.name));
}
async function loadFolder() {
  const files = await readJSONFiles('');
  FOLDER.errors = []; const packs = []; let mine = null;
  for (const f of files) {
    if (f.error) { FOLDER.errors.push(`${f.name}: ${f.error}`); continue; }
    if (f.name === MINE_FILE) mine = f.json;
    else if (isPackJSON(f.json)) packs.push(normPack(f.json, f.name));
    else if (!f.json.hailey100game) FOLDER.errors.push(`${f.name}: not a hailey 100 pack`);
  }
  FOLDER.state = 'ready'; FOLDER.name = FOLDER.handle.name;
  // packs you dropped in before the folder was connected move into it
  for (const p of LOCALPACKS) if (!packs.some((x) => x.file === p.file)) { await writeFile(p.file, packFile(p)); packs.push(p); }
  LOCALPACKS = []; store.set('h100.packs', '[]');
  PACKS = packs;
  if (mine) MINE = normMine(mine); else await writeFile(MINE_FILE, mineFile());
  store.set('h100.mine', JSON.stringify(MINE));
  rebuildLib();
}
const packFile = (p) => ({ hailey100: 1, name: p.name, about: p.about, cards: p.cards, decks: p.decks, formats: p.formats });
async function initFolder() {
  if (FOLDER.state === 'unsupported') return;
  const h = await idbGet('folder'); if (!h) return;
  FOLDER.handle = h; FOLDER.name = h.name;
  try {
    if ((await h.queryPermission({ mode: 'readwrite' })) === 'granted') await loadFolder(); else FOLDER.state = 'asking';
  } catch (e) { FOLDER.state = 'asking'; }
  render();
}
async function connectFolder() {
  let h; try { h = await window.showDirectoryPicker({ id: 'hailey100-packs', mode: 'readwrite' }); } catch (e) { if (e.name !== 'AbortError') toast("Folders can't be opened from here. Open the game from your hailey.tools folder to connect one."); return; }
  FOLDER.handle = h; await idbSet('folder', h);
  try { await loadFolder(); toast(`Connected ${h.name}. ${plural(PACKS.length, 'pack')} loaded.`); } catch (e) { toast("Couldn't read that folder: " + e.message); }
  render();
}
async function reconnectFolder() {
  try { if ((await FOLDER.handle.requestPermission({ mode: 'readwrite' })) === 'granted') { await loadFolder(); toast(`Reloaded ${plural(PACKS.length, 'pack')}.`); } } catch (e) { toast("Couldn't open the packs folder: " + e.message); }
  render();
}
async function reloadPacks() { if (FOLDER.state !== 'ready') return; try { await loadFolder(); toast(`Reloaded ${plural(PACKS.length, 'pack')}.`); } catch (e) { toast("Couldn't read the packs folder: " + e.message); } render(); }
async function disconnectFolder() {
  FOLDER = { handle: null, state: 'none', name: '', errors: [] }; await idbSet('folder', null);
  PACKS = [...BUNDLED_PACKS.map((p) => ({ ...normPack(p, p.file), bundled: true })), ...LOCALPACKS]; rebuildLib(); render();
}
async function addPack(json, file) {
  const p = normPack(json, file.replace(/[\\/:*?"<>|]/g, '-'));
  if (FOLDER.state === 'ready') { await writeFile(p.file, packFile(p)); await loadFolder(); }
  else { LOCALPACKS = [...LOCALPACKS.filter((x) => x.file !== p.file), p]; store.set('h100.packs', JSON.stringify(LOCALPACKS.map((x) => ({ ...packFile(x), file: x.file })))); PACKS = [...PACKS.filter((x) => x.file !== p.file), p]; rebuildLib(); }
  toast(`Added the ${p.name} pack: ${[plural(p.cards.length, 'card'), plural(p.decks.length, 'deck'), plural(p.formats.length, 'format')].join(', ')}.`);
  render();
}
async function removePack(p) {
  if (FOLDER.state === 'ready') { try { await FOLDER.handle.removeEntry(p.file); } catch (e) { toast("Couldn't remove it: " + e.message); return; } await loadFolder(); }
  else { LOCALPACKS = LOCALPACKS.filter((x) => x.file !== p.file); store.set('h100.packs', JSON.stringify(LOCALPACKS.map((x) => ({ ...packFile(x), file: x.file })))); PACKS = PACKS.filter((x) => x !== p); rebuildLib(); }
  render();
}

function bigGlyph(def) {
  if (def.type === 'point') { const e = (def.effects || [])[0]; return def.sym || (e && e.op === 'points' ? amtText(e.amount) : '±'); }
  return def.sym || { act: '✦', ability: '✷', mutator: '∞', character: '☺' }[def.type] || '?';
}
function isNegPoint(def) { if (def.type !== 'point') return false; const e = (def.effects || [])[0]; return e && amtExp(e.amount) < 0; }
function cardHTML(def, o = {}) {

    log(html, cls, pv) { if (!io.dead) { game.log.push(pv ? { html, cls, pv } : { html, cls }); recordFrame(io); } },
    fx(ev) { if (io.dead) return; if (isHost() && io === NET.io && /^(pts|dice|play)$/.test(ev.type)) for (const g of NET.guests) { g.fx.push(ev); if (g.fx.length > 30) g.fx.shift(); } FX.push(ev); if (ev.type === 'dice') LASTDICE = { dice: ev.dice, pid: ev.pid, k: Math.random() }; if (ev.type === 'play') JUSTPLAYED = true; },

      if (cur && cur.bot) await gate(io); else await untilCurrent(io);

    },
    async ask(pid, req) {
      if (io.dead) return never();
      const p = P(io.g, pid);

      if (p.bot && req.kind === 'vote' && !io.g.players.some((x) => !x.bot)) {

        // nobody is connected for this seat any more, so a bot plays it
        p.remote = false; p.bot = true; p.dropped = true; io.log(`${nm(p)} isn't connected, so a bot plays for them`, 'dim');
      }
      if (p.bot) return botAsk(io, p, req);

    snapshot(g) { const cur = g.players[g.cur]; if (cur.bot) return null; io.snap = { s: clone(g), log: game.log.length, rolls: g.rolls, frames: game.frames.length }; return io.snap; },

    endSnapshot() { io.snap = null; },

}

  const fm = curFormat();

  resetLive(); LASTDICE = null;

  GIO.log(`New game: ${names}. First to ${G.cfg.target} wins.${G.mutator ? ` ${cn(G.mutator.c)} starts in play.` : ''}`, 'dim');

function recordFrame(io) {
  const g = io.g || G, game = io.game; if (!g || !game) return;
  const lite = { ...g, deck: { length: g.deck.length }, discard: { length: g.discard.length } };
  game.frames.push({ s: JSON.stringify(lite), n: game.log.length, dice: io === GIO ? LASTDICE : null });
}
// STEP = { frames: n } runs until the game has n frames, { turns: n } until turn n starts

}

}

function openGame(game) {

(async function playback() {

    await sleep(Math.max(90, (SPEEDS[SETUP.speed] ?? 650) * 0.6));

  }
})();
async function runGame(g, io) {
  io.g = g; const GAME = io.game; const LOGL = () => GAME.log.length;
  try {
    if (g.pregame) { if (io === GIO) render(); await pregame(g, io); if (io === GIO) render(); }
    while (!g.over && !io.dead) {
      if (g.turnNo > 3000) { g.over = true; break; }
      GAME.turns.push({ f: GAME.frames.length, s: JSON.stringify(g), log: LOGL(), turn: g.turnNo + 1 });
      if (g.players[g.cur].bot) await gate(io); else await untilCurrent(io);
      if (io.dead) break;
      const can = startTurn(g, io); if (io === GIO) { HINT = null; render(); }
      if (can) await actionLoop(g, io);
      if (g.over || io.dead) break;
      endTurn(g, io); if (io === GIO) render();
      await turnCheck(g, io); if (g.over || io.dead) break;
      const nxt = g.players[g.cur];
      await sleep(nxt.bot || g.players[(g.cur - g.dir + g.players.length) % g.players.length].bot ? (SPEEDS[SETUP.speed] ?? 650) * 0.4 : 60);
    }
  } catch (err) { if (!io.dead) { console.error(err); GAME.log.push({ html: 'Something went wrong: ' + esc(err.message || err), cls: 'win' }); } }
  if (!io.dead) { GAME.over = g.over; GAME.winner = g.over && P(g, g.winner) ? P(g, g.winner).name : null; GAME.result = g.result || null; GAME.score = g.players.map((p) => p.points).join('–'); if (io === GIO) render(); }
}
function quitGame() { parkLive(); G = null; ASK = []; VIEW = null; render(); if (isHost()) netLobby(); }

// ----- highlights: the turns that swung a finished game the most -----
let HLSTOP = null, HLOPEN = true;
const plain = (h) => String(h).replace(/<[^>]+>/g, '');
function highlights(game) {
  if (game.hl) return game.hl;
  if (!game.over || !game.turns.length) return [];
  const T = game.turns, out = [];
  const endState = JSON.parse(game.frames[game.frames.length - 1].s);
  const target = endState.cfg?.target || 100;
  for (let i = 0; i < T.length; i++) {
    const a = JSON.parse(T[i].s), b = i + 1 < T.length ? JSON.parse(T[i + 1].s) : endState;
    const actor = a.players[a.cur]; if (!actor) continue;
    const d = a.players.map((p, k) => (b.players[k]?.points ?? p.points) - p.points);
    const gain = d[a.cur], hurt = -d.reduce((s, x, k) => s + (k === a.cur ? 0 : Math.min(0, x)), 0);
    const lines = game.log.slice(T[i].log, i + 1 < T.length ? T[i + 1].log : game.log.length);
    const plays = lines.filter((l) => / (plays|uses|reacts with|echoes) /.test(plain(l.html))).map((l) => l.html);
    const othersMax = (s, k0) => Math.max(...s.players.filter((_, k) => k !== k0).map((p) => p.points));
    const behind = othersMax(a, a.cur) - actor.points, aheadAfter = (b.players[a.cur]?.points ?? 0) - othersMax(b, a.cur);
    const comeback = a.players.length > 1 && behind >= target * 0.15 && aheadAfter > 0;
    const winning = i === T.length - 1 && b.winner === actor.id && !b.result;
    const swing = gain + hurt;
    let score = Math.max(0, swing) / target * 100 * (1 + 0.15 * Math.max(0, plays.length - 1)) + (comeback ? 30 : 0) + (winning ? 15 : 0);
    if (score < 12 && !winning) continue;
    const kind = winning ? 'winning turn' : comeback ? 'comeback' : hurt > Math.max(gain, 0) ? 'big hit' : plays.filter((p) => !/ uses /.test(plain(p))).length >= 2 ? 'combo' : 'big turn';
    const deltas = a.players.map((p, k) => (d[k] ? `<span class="${d[k] > 0 ? 'up' : 'down'}"><b class="pn" style="--pc:${p.color}">${esc(p.name)}</b> ${signed(d[k])}</span>` : '')).filter(Boolean).join(' ');
    out.push({ i, turn: T[i].turn, f: T[i].f, end: i + 1 < T.length ? T[i + 1].f - 1 : game.frames.length - 1, kind, score, who: actor, plays: plays.slice(0, 6), deltas });
  }
  game.hl = out.sort((x, y) => y.score - x.score).slice(0, 5).sort((x, y) => x.i - y.i);

}
function highlightsHTML(game, n) {
  const list = highlights(game); if (!list.length) return '';
  const show = n ? list.slice().sort((x, y) => y.score - x.score).slice(0, n).sort((x, y) => x.i - y.i) : list;
  return `<div class="hls">${show.map((h) => `<div class="hl"><div class="hlhead"><span class="hlkind">${esc(h.kind)}</span><span class="muted">turn ${h.turn}</span><span class="spacer"></span><button class="btn sm" data-hl="${list.indexOf(h)}">▶ watch</button></div>
    <div class="hlwho"><b class="pn" style="--pc:${h.who.color}">${esc(h.who.name)}</b>: ${h.plays.length ? h.plays.map((p) => { const t = plain(p); return t.startsWith(h.who.name + ' ') ? t.slice(h.who.name.length + 1) : t; }).map(esc).join(', then ') : 'a big turn'}</div>
    <div class="hldelta">${h.deltas}</div></div>`).join('')}</div>`;
}
function watchHighlight(k) {
  const h = highlights(GAME)[k]; if (!h) return;

// ----- bots -----
async function botAsk(io, p, req) {
  const pid = p.id;
  await gate(io); if (io.dead) return never();
  if (G.turn && G.turn.pid === pid) {
    let b = PLANS[pid];
    if (!b || b.turn !== G.turnNo) b = PLANS[pid] = { turn: G.turnNo, plan: null, i: 0 };
    if (req.kind === 'action' && (!b.plan || b.i >= b.plan.seq.length)) {
      THINK = pid; render(); await sleep(40);
      b.plan = await botPlan(G, pid, p.diff); b.i = 0; THINK = null;
    }
    if (b.plan && b.i < b.plan.seq.length && b.plan.kinds[b.i] === req.kind) {
      const ix = b.plan.seq[b.i++];
      if (ix < req.options.length) { await botPause(req); return req.options[ix]; }
    }
    if (b.plan) b.i = b.plan.seq.length;
  }
  await botPause(req);
  return heuristic(G, pid, req);
}
async function botPause(req) { if (req.kind !== 'action') { const ms = (SPEEDS[SETUP.speed] ?? 650) * 0.5; if (ms) await sleep(ms); } }

// ----- people -----
function humanAsk(p, req) {
  return new Promise((res, rej) => {
    const e = { pid: p.id, req, res, rej, cancellable: !!(GIO.snap && req.kind !== 'action' && G.rolls === GIO.snap.rolls && ASK.length === 0 && !NESTED) };
    ASK.push(e);

  });
}
function topAsk() { return ASK[ASK.length - 1] || null; }
function answer(v) { const e = ASK.pop(); if (!e) return; e.res(v); render(); }

async function maybeHint(p) {
  const ch = p.character && CARD[p.character];
  if (!(G.cfg.hints || ch?.start?.hints || p.isNew)) return;
  const key = `${G.turnNo}:${G.turn?.plays}:${p.abilities.filter((a) => a.cd === 0).length}:${p.hand.length}`;
  if (HINT && HINT.key === key) return;
  HINT = { key, text: null, pid: p.id };
  await sleep(30);
  const g = G; const plan = await botPlan(g, p.id, 'normal');
  if (g !== G || !HINT || HINT.key !== key) return;
  HINT.text = plan.labels.length ? plan.labels.slice(0, 5).join(', then ') : null;
  render();
}
// people at this screen: online players play from their own browsers, so they never count here

function viewerPid() {
  if (isGuest()) return NET.pid;
  const t = topAsk(); if (t && !P(G, t.pid).bot) return t.pid;
  const cur = G.players[G.cur]; if (!cur.bot && !cur.remote) return cur.id;
  const hs = humans(); if (hs.length === 1) return hs[0].id; if (!hs.length) return cur.id;
  return null;
}
function needsCover() {
  const t = topAsk(); if (!t || G.over || isGuest()) return false;

// tips for players marked new: each one shows once per game, the first time it matters
const TIPSEEN = new Set();
function nextTip(p, req) {
  const T = (k, txt) => ({ k, txt });
  const T2 = [];
  const hand = p.hand.map((c) => CARD[c.c]).filter(Boolean);
  if (req.kind === 'draft') T2.push(T('draft', 'Before the game starts, everyone picks cards. Tap one of the cards below to take it.'));
  if (req.kind === 'action') {
    T2.push(T('start', `Each turn you draw a card, then play one from your hand. Point cards add to your score, or take from it if they're minus cards. First to ${G.cfg.target} wins.`));
    if (req.options.some((o) => o.startsWith('a:'))) T2.push(T('ability', "Abilities stay with you. Use a ready one any time on your turn, for free, then it recharges for a few turns (that's the ⟳ number)."));
    if (hand.some((d) => isNegPoint(d))) T2.push(T('minus', `Minus cards cost you points if you play them yourself. Send makes someone else play a card from your hand, which is the best way to get rid of them.${G.cfg.allowPass ? ' You can also pass instead.' : ''}`));
    if (hand.some((d) => d.type === 'mutator')) T2.push(T('mutcard', 'Mutator cards change the rules for everyone once played. Only one can be in play, so a new one replaces the old one.'));
    if (G.mutator) T2.push(T('mutator', `${esc(CARD[G.mutator.c]?.name)} is in play, so its rule applies to everyone until another mutator replaces it.`));
    if (p.hand.length >= handLimit(G, p)) T2.push(T('limit', `Your hand is full (${handLimit(G, p)} cards), so you skip drawing until you play some.`));
    if (hand.some((d) => isReaction(d))) T2.push(T('reactcard', "Reaction cards like inspire aren't played like normal cards. Hold on to them, and the game asks if you want one whenever points are about to change on your turn."));
  }
  if (req.kind === 'player') T2.push(T('player', 'Pick who this card hits. The number next to each name is their score.'));
  if (req.kind === 'card' && req.purpose === 'send') T2.push(T('send', 'Pick a card from your hand. The player you chose has to play it right away, and it counts as theirs, so a minus card hurts them.'));
  if (req.kind === 'card' && req.purpose !== 'send') T2.push(T('cardask', 'Pick one of the highlighted cards in your hand.'));
  if (req.kind === 'react') T2.push(T('react', "Points are about to change. You can add a reaction card to make the change bigger, which helps when you're gaining or someone else is losing. Or just let it land."));
  if (req.kind === 'vote') T2.push(T('vote', 'The game has run long, so everyone decides together whether to stop or keep going.'));
  for (const x of T2) { const key = `${GAME?.id}:${p.id}:${x.k}`; if (!TIPSEEN.has(key)) { TIPSEEN.add(key); return x.txt; } }
  return null;
}
function preHTML() {
  const pr = G.pre; const rows = [];
  if (pr.banned.length) rows.push(`<div><span class="label">Banned</span><div class="mods">${pr.banned.map((id) => `<span class="chip">${cn(id)}</span>`).join('')}</div></div>`);
  if (pr.picked.length) rows.push(`<div><span class="label">Picked</span><div class="mods">${pr.picked.map((x) => `<span class="chip">${cn(x.id)} <span class="muted">${esc(P(G, x.pid)?.name)}</span></span>`).join('')}</div></div>`);
  if (pr.drafted.length) rows.push(`<div><span class="label">Drafted into the deck</span><div class="mods">${pr.drafted.map((id) => `<span class="chip">${cn(id)}</span>`).join('')}</div></div>`);

      const fl = OPS[el.value].f; for (const k of Object.keys(keep)) if (fl.includes(k) && el.value !== 'if') step[k] = keep[k];
      renderLayer(); return;
    }
    if (f === 'cond') { if (e.type !== 'change') return; step.cond = el.value; if (el.value in COND_NEEDS_V) step.v = COND_NEEDS_V[el.value]; else delete step.v; renderLayer(); return; }
    step[f] = el.type === 'number' ? +el.value : el.value;
    if (f === 'amount') el.classList.toggle('bad', !parseAmt(el.value));
