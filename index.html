}
function onEditorClick(b) {
  const d = MODAL.d;
  if (b.dataset.e) {
    const path = b.dataset.path; const k = b.dataset.e;
    if (k === 'add') { const list = getAt(path); list.push({ op: 'points', target: 'self', amount: '5' }); }
    else if (k === 'pickdel') { d.start[b.dataset.key].splice(+b.dataset.i, 1); }
    else {
      const parts = path.split('.'); const i = +parts.pop(); const list = getAt(parts.join('.'));
      if (k === 'del') list.splice(i, 1);
      if (k === 'up' && i > 0) [list[i - 1], list[i]] = [list[i], list[i - 1]];
      if (k === 'down' && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
    }
    renderLayer(); return;
  }
  if (b.dataset.ed === 'save') {
    const bad = [];
    const walk = (list) => (list || []).forEach((e) => { if (OPS[e.op]?.f.includes('amount') && !parseAmt(e.amount)) bad.push(e.amount); if (e.op === 'if') { walk(e.then); walk(e.else); } });
    walk(d.effects);
    if (!String(d.name || '').trim()) { MODAL.err = 'Give the card a name.'; renderLayer(); return; }
    if (bad.length) { MODAL.err = `"${bad[0]}" isn't an amount. Use a number like 5 or -5, or dice like 1d6.`; renderLayer(); return; }
    d.name = d.name.trim();
    if (!['point', 'act', 'ability'].includes(d.type)) delete d.effects;
    if (d.type !== 'ability') delete d.cooldown;
    if (!['mutator', 'character'].includes(d.type)) delete d.rules;
    if (d.type !== 'character') { delete d.start; delete d.assist; }
    if (d.type === 'character') delete d.copies;
    if (!d.text) delete d.text; if (!d.sym) delete d.sym; if (!d.silly) delete d.silly;
    if (MODAL.orig) { d.id = MODAL.orig; const i = LIB.findIndex((c) => c.id === MODAL.orig); if (i >= 0) LIB[i] = d; else LIB.push(d); }
    else { d.id = newId(d.name); LIB.push(d); }
    saveLib(); MODAL = { kind: 'detail', id: d.id }; render();
  }
}

// =============== SAVED GAMES ===============
// a save is the whole replay plus the cards it used, so it plays on from the start of its latest turn
const safeName = (n) => n.replace(/[\\/:*?"<>|]/g, '-');
function gameFileName(game) {
  const d = new Date(game.started || Date.now()); const pad = (n) => String(n).padStart(2, '0');
  return safeName(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}.${pad(d.getMinutes())} ${game.names.join(' vs ')}.json`);
}
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
async function saveGame(game) {
  if (!game) return;
  if (!game.turns.length) { toast('Games can be saved once the first turn starts.'); return; }
  const last = game.turns[game.turns.length - 1];
  const data = JSON.stringify({ hailey100game: 1, saved: new Date().toISOString(), names: game.names, format: game.format || '', over: game.over, winner: game.winner, score: game.score, started: game.started, result: game.result || null, cards: Object.values(CARD), frames: game.frames, turns: game.turns, log: game.log });
  const name = gameFileName(game);
  const note = game.over ? '' : ` Loading it plays on from the start of turn ${last.turn}.`;
  if (FOLDER.state === 'ready') { try { await writeFile(name, data, 'saves'); toast(`Saved to saves/${name}.${note}`); return; } catch (e) { toast("Couldn't save to the packs folder, so it went to your downloads."); } }
  download(name, data); if (FOLDER.state !== 'ready') toast(`Saved ${name} to your downloads.${note}`);
}
function loadGameData(j, name) {
  if (!j || !j.hailey100game || !Array.isArray(j.frames) || !j.frames.length || !Array.isArray(j.turns)) { toast(`${name} isn't a saved game.`); return; }
  for (const c of j.cards || []) if (c && c.id && !LIB.some((x) => x.id === c.id)) EXTRA[c.id] = c;
  indexLib();
  const game = { id: ++GAMECOUNT, frames: j.frames, turns: j.turns, log: j.log || [], over: !!j.over, winner: j.winner || null, result: j.result || null, score: j.score || '', names: j.names || [], format: j.format || '', started: j.started, file: name };
  GAMES.unshift(game); if (GAMES.length > 10) GAMES.length = 10;
  MODAL = null; GAME = null; openGame(game);
  toast(`Loaded ${name}.`);
}
async function openSaves() {
  MODAL = { kind: 'saves', list: FOLDER.state === 'ready' ? null : [] }; renderLayer();
  if (FOLDER.state === 'ready') { const list = await listFiles('saves'); if (MODAL?.kind === 'saves') { MODAL.list = list; renderLayer(); } }
}
function savesHTML() {
  const M = MODAL; const when = (t) => new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  const rows = M.list === null ? '<p class="muted">Looking in the saves folder…</p>' : M.list.length ? `<div class="filelist">${M.list.map((f, i) => `<button class="btn rg" data-sv="${i}"><b>${esc(f.name.replace(/\.json$/i, ''))}</b><span class="muted">${when(f.modified)} · ${Math.max(1, Math.round(f.size / 1024))} kb</span></button>`).join('')}</div>` : FOLDER.state === 'ready' ? '<p class="muted">No saved games in the saves folder yet. Use Save game while you play.</p>' : '';
  return `<div class="overlay" data-close="modal"><div class="modal" style="width:min(560px,100%)"><div class="mhead"><h2>Load a game</h2><span class="spacer"></span><button class="iconbtn" data-m="close" title="Close">✕</button></div>
    <div class="mbody">${FOLDER.state === 'ready' ? `<p class="muted" style="margin-top:0">Saved games live in the saves folder inside ${esc(FOLDER.name)}.</p>` : '<p class="muted" style="margin-top:0">Saved games download as .json files. Open one here, or drop it anywhere on the page. Connect a packs folder to keep saves in a folder instead.</p>'}
    ${rows}
    <div class="row" style="margin-top:12px"><label class="btn">Open a saved game…<input type="file" id="svfile" accept=".json,application/json" hidden></label></div></div></div></div>`;
}

// =============== PACKS ===============
function openPacks() { MODAL = { kind: 'packs' }; renderLayer(); }
function packsHTML() {
  const st = FOLDER.state;
  const status = st === 'unsupported' ? `<p class="muted" style="margin-top:0">This browser can't connect to folders, so packs and your changes are kept in this browser. Add packs with Add pack files below (or drop them onto the page), and use Export my stuff to back up or move to another device.</p>`
    : st === 'ready' ? `<p style="margin-top:0">Connected to <b>${esc(FOLDER.name)}</b>. Every .json pack in it is loaded, and your own cards, decks and formats save to ${MINE_FILE} in it.</p><div class="row"><button class="btn" data-pk="reload">Reload packs</button><button class="btn" data-pk="connect">Pick another folder</button><button class="btn" data-pk="disconnect">Disconnect</button></div>`
    : st === 'asking' ? `<p style="margin-top:0">The packs folder <b>${esc(FOLDER.name)}</b> needs your OK again before the game can read it.</p><div class="row"><button class="btn primary" data-pk="reconnect">Reconnect ${esc(FOLDER.name)}</button><button class="btn" data-pk="connect">Pick another folder</button></div>`
    : `<p style="margin-top:0">Connect the <b>hailey100/packs</b> folder and the game loads every pack file in it, and saves your own cards, decks, formats and games there instead of in the browser. New packs are then just files you drop into that folder.</p><div class="row"><button class="btn primary" data-pk="connect">Connect the packs folder</button></div>`;
  const list = PACKS.length ? PACKS.map((p, i) => `<div class="packrow"><div><b>${esc(p.name)}</b>${p.bundled ? ' <span class="chip">comes with the game</span>' : ''}<br><span class="muted">${esc(p.about)}${p.about ? ' ' : ''}${[[p.cards.length, 'card'], [p.decks.length, 'deck'], [p.formats.length, 'format']].filter(([n]) => n).map(([n, w]) => plural(n, w)).join(', ')} · ${esc(p.file)}</span></div><span class="spacer"></span>${p.bundled ? '' : `<button class="btn sm danger" data-pk="rm" data-i="${i}">Remove</button>`}</div>`).join('') : '<p class="muted">No packs yet.</p>';
  return `<div class="overlay" data-close="modal"><div class="modal" style="width:min(640px,100%)"><div class="mhead"><h2>Packs</h2><span class="spacer"></span><button class="iconbtn" data-m="close" title="Close">✕</button></div>
    <div class="mbody">${status}
    <p class="label" style="margin-top:16px">Loaded packs</p>${list}
    ${FOLDER.errors?.length ? `<p class="note" style="color:var(--red)">Skipped: ${FOLDER.errors.map(esc).join('; ')}</p>` : ''}
    <div class="row" style="margin-top:14px"><label class="btn">Add pack files…<input type="file" id="pkfile" accept=".json,application/json" multiple hidden></label><button class="btn" data-pk="export">Export my stuff as a pack</button></div>
    <p class="note">You can also drop pack files or saved games anywhere on the page.</p></div></div></div>`;
}
async function onPacksClick(b) {
  const k = b.dataset.pk;
  if (k === 'connect') await connectFolder();
  else if (k === 'reconnect') await reconnectFolder();
  else if (k === 'reload') await reloadPacks();
  else if (k === 'disconnect') await disconnectFolder();
  else if (k === 'rm') { const p = PACKS[+b.dataset.i]; if (p) openConfirm(`Remove the ${p.name} pack?`, FOLDER.state === 'ready' ? `This deletes ${p.file} from the packs folder.` : 'It leaves this browser.', 'Remove pack', () => { removePack(p).then(openPacks); }); return; }
  else if (k === 'export') { download('my stuff.json', JSON.stringify(mineFile(), null, 1)); toast('Saved my stuff.json to your downloads.'); }
  if (MODAL?.kind === 'packs') renderLayer();
}
async function takeFiles(files) {
  for (const f of files) {
    if (!/\.json$/i.test(f.name) && f.type !== 'application/json') { toast(`${f.name} isn't a .json file.`); continue; }
    let j; try { j = JSON.parse(await f.text()); } catch (e) { toast(`${f.name} isn't valid JSON.`); continue; }
    if (j && j.hailey100game) loadGameData(j, f.name);
    else if (isPackJSON(j)) { if (f.name === MINE_FILE) { toast(`${MINE_FILE} is your own stuff. Rename it to add it as a pack.`); continue; } await addPack(j, f.name); }
    else toast(`${f.name} isn't a pack or a saved game.`);
  }
  if (MODAL?.kind === 'packs') renderLayer();
}
(function dropZone() {
  let depth = 0;
  const has = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  addEventListener('dragenter', (e) => { if (!has(e)) return; depth++; document.body.classList.add('dropping'); });
  addEventListener('dragleave', (e) => { if (!has(e)) return; if (--depth <= 0) { depth = 0; document.body.classList.remove('dropping'); } });
  addEventListener('dragover', (e) => { if (has(e)) e.preventDefault(); });
  addEventListener('drop', (e) => { if (!has(e)) return; e.preventDefault(); depth = 0; document.body.classList.remove('dropping'); takeFiles([...e.dataTransfer.files]); });
})();

// =============== RULES ===============
function renderRules(main) {
  main.innerHTML = `<div class="rules">
  <section class="panel">
    <h2>Basic rules</h2>
    <p>Everyone starts at 0 points with 5 cards. Take turns playing cards. The first person to reach <b>100 points</b> wins straight away.</p>
    <p class="label">On your turn</p>
    <ol>
      <li>Draw a card (unless your hand is full).</li>
      <li>Play one card from your hand. You have to play one if you can.</li>
      <li>Use any of your ready abilities, as many as you like, whenever you like during your turn.</li>
      <li>End your turn. Every ability cooldown ticks down by 1, for everyone.</li>
    </ol>
    <p class="label">The five kinds of card</p>
    <ul>
      <li><b class="cnm t-point">Point cards</b> gain or lose points. "1d6" means roll a six-sided die for the number.</li>
      <li><b class="cnm t-act">Act cards</b> do something once to you, someone else, or everyone, then go to the discard pile. Reaction acts like inspire are played while a point change is happening.</li>
      <li><b class="cnm t-ability">Ability cards</b> stay in front of you after you play them. Use one and it goes on cooldown for that many turns. Everyone's turns count.</li>
      <li><b class="cnm t-mutator">Mutators</b> change the rules for everyone while they're in play. Playing a new one replaces the old one.</li>
      <li><b class="cnm t-character">Characters</b> are optional. Pick one before the game for a starting bonus, a passive effect, or an assist like suggested moves.</li>
    </ul>
    <p class="label">How a point change adds up</p>
    <p>Every gain or loss is worked out in the same order, so combos are predictable:</p>
    <ol>
      <li>The number on the card, or the dice roll.</li>
      <li>Reactions, like inspire. They make the change bigger in whichever direction it's going.</li>
      <li>Boosts that last the whole turn, if you make a card with one.</li>
      <li>"Next change" multipliers, like Double Down.</li>
      <li>The mutator in play.</li>
      <li>The character of whoever is gaining or losing.</li>
      <li>A shield blocks the loss completely.</li>
    </ol>
    <div class="example"><b>Example.</b> Double Points is in play. You Send a −5 points card to the leader, and as it lands you react with inspire, which rolls a 4.
      <span class="calc">−5 · Inspire −4 = −9 · Double Points −18</span></div>
  </section>
  <section class="panel">
    <h2>Extra rules</h2>
    <p class="muted">The game sheet left these open, so here is what the app does. The ones marked with a switch can be changed on the Play tab.</p>
    <ul>
      <li><b>One card per turn, and you have to play it.</b> Without this, nobody would ever play their own minus cards, so they'd only matter for Send. Switch: Allow passing.</li>
      <li><b>Scores can go below 0.</b> With a floor at 0, minus cards cost nothing when you're at 0. Switch: Points can't go below 0.</li>
      <li><b>Hand limit 8.</b> Nothing can take you over it. Draws stop when your hand is full, you can't steal or be given cards with a full hand, and if a hand swap or a rule change leaves you over, the extras are discarded at random.</li>
      <li><b>Abilities are ready the moment you play the card</b>, and using one doesn't use up your card play. Cooldown 3 means three turns have to end before you can use it again, counting the one you used it in.</li>
      <li><b>Reactions like inspire</b> can be played by whoever's turn it is, any time a point change is about to land, on anyone. They don't use up your card play. Abilities also work mid-card.</li>
      <li><b>A sent card belongs to whoever plays it.</b> "You" on the card means them, and they make any choices on it.</li>
      <li><b>Echo copies the last point or act card</b>, but never another Echo.</li>
      <li><b>If two people pass 100 at once</b>, the higher score wins. A tie goes to whoever was taking the turn, then the next in turn order.</li>
      <li><b>Halves round away from 0</b>, so −5 halved is −3 and +5 halved is +3.</li>
      <li><b>When the deck runs out</b>, the discard pile is shuffled into a new deck.</li>
    </ul>
    <p class="label">Format options</p>
    <ul>
      <li><b>Pick and ban</b> happens first. From the whole deck or a random selection, everyone bans in turn order (every copy of a banned card leaves the deck), then picks in reverse order. A pick goes into your starting hand, or adds two more copies to the deck, depending on the format.</li>
      <li><b>Drafting the deck</b>: point cards are always in. Everyone takes turns picking from a few random cards, and each pick puts all its copies into the shared deck. The order snakes, so whoever picks last in a round picks first in the next.</li>
      <li><b>Drafting hands</b>: everyone gets a pack of cards, takes one, and passes the rest to the next player, until starting hands are full. Leftovers go back into the deck.</li>
      <li><b>The turn rule</b>: after that many turns with no winner, everyone votes. One vote to keep playing means that many more turns. Ending on the standings needs everyone to agree, and any other mix of end votes is a tie. In a game with only bots, you vote for them or let them decide.</li>
      <li><b>Shields stack</b> by default, so two shields block two losses. A format can turn that off, and then a second shield does nothing while you still have one.</li>
      <li><b>New player mode</b>: anyone marked new gets a tip the first time something comes up, plus suggested moves. Everyone else at the table plays as normal, so new and experienced players can play together. The tutorial format turns it on with a smaller, simpler deck.</li>
      <li><b>Silly cards</b> are ridiculous or unbalanced on purpose. They only show up in formats that allow them, and you can mark any card silly in the editor.</li>
    </ul>
    <p class="label">About the bots</p>
    <p>On its turn a bot plays out every order of cards, abilities and targets it could pick, rolls the dice a few times for each, and keeps the plan that leaves it furthest ahead. That's how it finds combos like sending a −5 to the leader and then reacting with inspire. Easy bots look at fewer plans and make mistakes on purpose. Hard bots look at more plans and roll more dice for each one, though luck still decides plenty of games.</p>
  </section></div>`;
  main.onclick = main.oninput = main.onchange = null;
}
